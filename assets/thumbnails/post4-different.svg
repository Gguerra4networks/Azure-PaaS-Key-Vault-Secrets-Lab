<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" font-family="Arial, sans-serif">
  <rect width="1200" height="628" fill="#06200f"/>
  <rect x="40" y="40" rx="10" width="700" height="548" fill="#0b2e17" stroke="#1f6f3a"/>
  <g font-family="Consolas, monospace" font-size="18">
    <text x="65" y="85" fill="#ff7b72"># BEFORE</text>
    <text x="65" y="115" fill="#c9d1d9">Public network access: Disabled</text>
    <text x="65" y="143" fill="#c9d1d9">Query editor: cannot connect</text>
    <text x="65" y="171" fill="#c9d1d9">vm-web-01:    cannot connect</text>
    <text x="65" y="225" fill="#3fb950"># FIX</text>
    <text x="65" y="257" fill="#56d364">az sql server update -g $RG -n $SQL_SERVER `</text>
    <text x="95" y="283" fill="#56d364">--enable-public-network true</text>
    <text x="65" y="323" fill="#56d364">az sql server firewall-rule create `</text>
    <text x="95" y="349" fill="#56d364">-g $RG -s $SQL_SERVER -n AllowAzureServices `</text>
    <text x="95" y="375" fill="#56d364">--start-ip-address 0.0.0.0 `</text>
    <text x="95" y="401" fill="#56d364">--end-ip-address 0.0.0.0</text>
    <text x="65" y="455" fill="#3fb950"># VERIFY</text>
    <text x="65" y="487" fill="#56d364">az sql server show -g $RG -n $SQL_SERVER `</text>
    <text x="95" y="513" fill="#56d364">--query publicNetworkAccess</text>
    <text x="65" y="551" fill="#c9d1d9">"Enabled"</text>
  </g>
  <text x="780" y="220" fill="#fff" font-size="52" font-weight="bold">What I'd do</text>
  <text x="780" y="285" fill="#fff" font-size="52" font-weight="bold">differently</text>
  <text x="780" y="350" fill="#7ee787" font-size="26">Check the SQL firewall</text>
  <text x="780" y="385" fill="#7ee787" font-size="26">before you need it.</text>
  <text x="780" y="560" fill="#a3d9b1" font-size="20" font-weight="bold">CEA LAB 03</text>
</svg>
